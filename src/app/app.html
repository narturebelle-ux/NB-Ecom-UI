<app-navbar></app-navbar>

@if (invite.inviterName() && !api.currentUser()) {
  <div class="invite-banner" role="status">
    <span>💌 <strong>{{ invite.inviterName() }}</strong> invited you to NartureBelle™, care for every stage of motherhood.</span>
    <a routerLink="/auth/signup" class="invite-cta">Create your account</a>
    <button type="button" class="invite-close" aria-label="Dismiss" (click)="invite.dismissBanner()">✕</button>
  </div>
}

<main class="app-main">
  <router-outlet></router-outlet>
</main>

<app-footer></app-footer>

<!-- Global Drawer — hidden behind its flag, not deleted (roadmap Phase 0) -->
<app-cart-drawer *appFeature="'productRecommendations'"></app-cart-drawer>

<!-- Global Toast Notification -->
@if (api.toastMessage(); as msg) {
  <div class="toast glass" role="alert">
    <span>🌸</span>
    <span>{{ msg }}</span>
  </div>
}
