<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NartureBelle™ | Professional-Led Care, Pregnancy to Postpartum</title>
  <base href="/">
  <!-- Apply the saved or device theme before first paint, so dark mode doesn't flash white. Same logic as ThemeService. -->
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('nb_theme'); } catch (e) {}
      if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NartureBelle™ connects expecting and new mothers with verified doctors, nurses and specialists through every stage — pregnancy, delivery, postpartum and early childcare — with records kept secure and private throughout.">
  <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">

  <!-- Google Fonts: Playfair Display + Plus Jakarta Sans, Material Icons for UI iconography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">
</head>

</body>
</html>
